name: Compilar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/milauncher.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/milauncher.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secretos de firma: se usa la llave de depuración"
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Nombrar APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "MiLauncher-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MiLauncher
          path: MiLauncher-*.apk

      # Publica el APK directo (sin zip) en Releases con cada cambio
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mi Launcher ${{ env.VER }} (build ${{ github.run_number }})
          files: MiLauncher-*.apk
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
